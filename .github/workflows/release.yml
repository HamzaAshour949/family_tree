name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Intel + Apple Silicon)
            target: --mac
          - os: windows-latest
            name: Windows (x64 + arm64)
            target: --win
          - os: ubuntu-latest
            name: Linux (AppImage)
            target: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # With signing material configured (CSC_LINK / CSC_KEY_PASSWORD, plus
      # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to notarize) the
      # installers are signed. Without it macOS builds are ad-hoc signed, which
      # is what lets an arm64 app launch at all; Windows builds stay unsigned.
      - name: Package
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -z "$CSC_LINK" ]; then extra="-c.mac.identity=-"; fi
          npx electron-builder ${{ matrix.target }} --publish never $extra
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
